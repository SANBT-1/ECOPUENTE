<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoPuente | Panel admin</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#eef5ee;color:#222}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 20px;background:#1e2a24;color:#fff}
  header h1{margin:0;font-size:20px;color:#2ecc71}
  header a{color:#fff;text-decoration:none;background:#3498db;padding:9px 16px;border-radius:8px}
  main{max-width:900px;margin:30px auto;padding:0 15px}
  .caja{background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
  h2{margin-top:0}
  #buscar{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin-bottom:14px;font-size:15px}
  .fila{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #eee;flex-wrap:wrap}
  .av{width:42px;height:42px;border-radius:50%;background:#2ecc71;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
  .info{flex:1;min-width:180px;line-height:1.3}
  .info small{color:#777}
  .rol{font-size:12px;padding:3px 10px;border-radius:10px;color:#fff;background:#3498db}
  .rol.administrador{background:#8e44ad}
  button{border:0;border-radius:8px;padding:9px 14px;color:#fff;font-weight:bold;cursor:pointer;background:#8e44ad}
  button.quitar{background:#e74c3c}
  button:disabled{background:#bbb;cursor:not-allowed}
  #estado{text-align:center;color:#666;padding:20px}
</style>
</head>
<body>
<header>
  <h1>🛠 Panel de administración</h1>
  <a href="index.html">← Volver al inicio</a>
</header>
<main>
  <div class="caja">
    <h2>Usuarios registrados</h2>
    <input id="buscar" type="search" placeholder="Buscar por nombre o correo...">
    <div id="estado">Verificando permisos...</div>
    <div id="lista"></div>
  </div>
</main>

<script type="module">
import { auth, db, onAuthStateChanged, obtenerRol } from "./auth.js";
import { collection, getDocs, doc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
let usuarios = [], yo = null;

onAuthStateChanged(auth, async user => {
  if (!user) { location.href = "inicia-sesion.html"; return; }
  const rol = await obtenerRol(user);
  if (rol !== "administrador") { location.href = "index.html"; return; } // no es admin: fuera
  yo = user.uid;
  cargar();
});

async function cargar() {
  $("estado").textContent = "Cargando usuarios...";
  try {
    const snap = await getDocs(collection(db, "usuarios"));
    usuarios = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.nombre || a.email).localeCompare(b.nombre || b.email));
    $("estado").style.display = "none";
    pintar();
  } catch (e) {
    $("estado").textContent = "No se pudo cargar (¿publicaste las reglas de Firestore?): " + e.code;
  }
}

function pintar() {
  const q = $("buscar").value.toLowerCase();
  const lista = usuarios.filter(u => ((u.nombre || "") + (u.email || "")).toLowerCase().includes(q));
  $("lista").innerHTML = "";
  lista.forEach(u => {
    const esYo = u.id === yo, esAdmin = u.rol === "administrador";
    const f = document.createElement("div");
    f.className = "fila";
    f.innerHTML = `
      <div class="av">${(u.nombre || u.email || "?")[0].toUpperCase()}</div>
      <div class="info"><b></b>${esYo ? " (tú)" : ""}<br><small></small></div>
      <span class="rol ${u.rol}">${u.rol}</span>
      <button class="${esAdmin ? "quitar" : ""}" ${esYo ? "disabled title='No puedes cambiar tu propio rol'" : ""}>
        ${esAdmin ? "Quitar administrador" : "Hacer administrador"}</button>`;
    f.querySelector("b").textContent = u.nombre || "(sin nombre)";   // textContent evita inyectar HTML
    f.querySelector("small").textContent = u.email || "";
    f.querySelector("button").onclick = () => cambiar(u, esAdmin ? "usuario" : "administrador");
    $("lista").appendChild(f);
  });
  if (!lista.length) $("lista").innerHTML = "<p style='text-align:center;color:#777'>Sin resultados</p>";
}

async function cambiar(u, nuevo) {
  const txt = nuevo === "administrador" ? "dar permiso de administrador a" : "quitar el permiso de administrador a";
  if (!confirm(`¿Seguro que quieres ${txt} ${u.nombre || u.email}?`)) return;
  try {
    await updateDoc(doc(db, "usuarios", u.id), { rol: nuevo });
    u.rol = nuevo;
    pintar();
  } catch (e) { alert("No se pudo cambiar el rol: " + e.code); }
}

$("buscar").oninput = pintar;
</script>
</body>
</html>
