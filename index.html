<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoPuente</title>
<link rel="stylesheet" href="estilos.css">
<style>
.portada{text-align:center;padding:10px 0 34px}
.logobtn{width:210px;height:210px;border-radius:50%;background:#fff;border:0;padding:0;cursor:zoom-in;display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 0 0 8px var(--menta),var(--sombra);transition:transform .25s}
.logobtn:hover{transform:scale(1.04)}
.logobtn img{width:84%;height:84%;object-fit:contain;display:block}
.portada h1{font-size:clamp(40px,7vw,68px)}
.portada p{color:var(--gris);font-size:20px;margin-top:6px}
.portada .acciones{justify-content:center;margin-top:24px}
.portada .btn{padding:14px 30px;font-size:16px}
.tres{max-width:900px;margin:0 auto 26px}
.tres .card{text-align:center;padding:18px}
.tres .card h3{margin:12px 0 0}
dialog{border:0;background:transparent;padding:0;max-width:92vw}
dialog::backdrop{background:rgba(27,46,36,.8)}
dialog img{display:block;max-width:min(560px,90vw);max-height:84vh;background:#fff;border-radius:28px;padding:24px;cursor:zoom-out}
</style>
</head>
<body data-activo="inicio">
<main class="principal">
  <div class="wrap">
    <header class="portada">
      <button class="logobtn" id="logoBtn" type="button" aria-label="Ver el logo en grande">
        <img src="imagenes/logo empresarial.png" alt="Logo EcoPuente">
      </button>
      <h1>EcoPuente</h1>
      <p>Hábitos ecológicos al alcance de todos</p>
      <div class="acciones">
        <a class="btn" href="habitos.html">Mis hábitos</a>
        <a class="btn sec" href="informacion1.html">Información</a>
        <a class="btn sec" href="mapa.html">Mapa</a>
      </div>
      <div id="saludo"></div>
    </header>

    <div class="grid tres">
      <a class="card" href="informacion1.html"><img class="im" src="imagenes/planta.menu.png" alt="Información" loading="lazy"><h3>Información</h3></a>
      <a class="card" href="bicicletas.html"><img class="im" src="imagenes/bicicleta.jpg" alt="Bicicletas" loading="lazy"><h3>Bicicletas</h3></a>
      <a class="card" href="mapa.html"><img class="im" src="imagenes/maps.jpg" alt="Mapa" loading="lazy"><h3>Mapa</h3></a>
    </div>

    <div class="acciones" style="justify-content:center">
      <a class="btn sec" href="graficas.html">Datos estadísticos</a>
      <a class="btn sec" href="equipo.html">Equipo</a>
      <a class="btn sec" href="donaciones.html">Donaciones</a>
    </div>
  </div>
  <footer>© 2026 EcoPuente</footer>
</main>

<dialog id="lb"><img src="imagenes/logo empresarial.png" alt="Logo EcoPuente ampliado"></dialog>
<script src="nav.js"></script>
<script>
const lb=document.getElementById("lb");
document.getElementById("logoBtn").onclick=()=>lb.showModal();
lb.onclick=()=>lb.close();
</script>
</body>
</html>
