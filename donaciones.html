<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Donaciones Ambientales Colombia</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #2d3748;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 680px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    /* Botón Superior para Volver */
    .btn-back-header {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #4a5568;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 15px;
      transition: color 0.2s;
    }

    .btn-back-header:hover {
      color: #2e7d32;
    }

    h1 {
      color: #2e7d32;
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 8px;
    }

    p.subtitle {
      text-align: center;
      color: #718096;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #4a5568;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s ease;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #2e7d32;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* Tarjetas de Selección de Causa */
    .cause-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 5px;
    }

    .cause-card {
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fafafa;
    }

    .cause-card:hover {
      border-color: #81c784;
    }

    .cause-card.selected {
      border-color: #2e7d32;
      background-color: #e8f5e9;
    }

    .cause-card input {
      display: none;
    }

    .cause-icon {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .cause-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: #2d3748;
    }

    .cause-org {
      font-size: 0.75rem;
      color: #718096;
      margin-top: 4px;
    }

    /* Accesos rápidos de monto */
    .quick-amounts {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    .quick-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid #cbd5e0;
      background: #f7fafc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    .quick-btn:hover {
      background: #edf2f7;
    }

    /* Botones de acción */
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-submit {
      flex: 2;
      background-color: #2e7d32;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1b5e20;
    }

    .btn-secondary {
      flex: 1;
      background-color: #e2e8f0;
      color: #4a5568;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .btn-secondary:hover {
      background-color: #cbd5e0;
    }

    @media (max-width: 500px) {
      .grid-2, .button-group {
        grid-template-columns: 1fr;
        flex-direction: column-reverse;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Enlace superior para regresar al menú principal -->
    <a href="index.html" class="btn-back-header">← Volver al Menú Principal</a>

    <h1>Siembra Futuro Colombia</h1>
    <p class="subtitle">Apoya causas locales por el agua, los árboles y la movilidad sostenible</p>

    <form id="donationForm">
      <!-- 1. Datos del Usuario -->
      <div class="form-group">
        <label>Nombre Completo *</label>
        <input type="text" id="nombre" required placeholder="Ej. Camilo Andrés Pérez">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Correo Electrónico *</label>
          <input type="email" id="email" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label>Teléfono / WhatsApp *</label>
          <input type="tel" id="telefono" required placeholder="300 123 4567">
        </div>
      </div>

      <!-- 2. Selección de Causa / Movimiento en Colombia -->
      <div class="form-group">
        <label>Selecciona el movimiento al que deseas donar *</label>
        <div class="cause-options">
          
          <label class="cause-card" onclick="selectCause(this)">
            <input type="radio" name="causa" value="agua" data-org="Fundación Natura Colombia" data-url="https://natura.org.co/donaciones" required>
            <div class="cause-icon">💧</div>
            <div class="cause-title">Protección del Agua</div>
            <div class="cause-org">Fundación Natura</div>
          </label>

          <label class="cause-card" onclick="selectCause(this)">
            <input type="radio" name="causa" value="arboles" data-org="Red de Árboles Colombia" data-url="https://www.reddearboles.org/donar-arboles" required>
            <div class="cause-icon">🌳</div>
            <div class="cause-title">Reforestación</div>
            <div class="cause-org">Red de Árboles</div>
          </label>

          <label class="cause-card" onclick="selectCause(this)">
            <input type="radio" name="causa" value="bicicleta" data-org="Despacio / BiciRed Colombia" data-url="https://www.despacio.org/hazte-socio" required>
            <div class="cause-icon">🚲</div>
            <div class="cause-title">Movilidad en Bici</div>
            <div class="cause-org">Despacio / BiciRed</div>
          </label>

        </div>
      </div>

      <!-- 3. Valor en Pesos Colombianos (COP) -->
      <div class="form-group">
        <label>Monto a donar (COP - Pesos Colombianos) *</label>
        <div class="quick-amounts">
          <button type="button" class="quick-btn" onclick="setAmount(20000)">$20.000</button>
          <button type="button" class="quick-btn" onclick="setAmount(50000)">$50.000</button>
          <button type="button" class="quick-btn" onclick="setAmount(100000)">$100.000</button>
        </div>
        <input type="number" id="monto" min="5000" step="1000" required placeholder="Ingresa un valor (mínimo $5.000 COP)">
      </div>

      <!-- 4. Método de Pago -->
      <div class="form-group">
        <label>Método de Pago *</label>
        <select id="metodoPago" required>
          <option value="" disabled selected>Selecciona un método de pago</option>
          <option value="PSE">PSE (Débito bancario Colombia)</option>
          <option value="Tarjeta">Tarjeta de Crédito / Débito</option>
          <option value="Nequi">Nequi / Daviplata</option>
          <option value="Efectivo">Efecty / Baloto (Efectivo)</option>
        </select>
      </div>

      <!-- Botones principales -->
      <div class="button-group">
        <a href="index.html" class="btn-secondary">Volver al Menú</a>
        <button type="submit" class="btn-submit">Continuar al Pago Directo ➔</button>
      </div>
    </form>
  </div>

  <script>
    // Resaltar la tarjeta seleccionada
    function selectCause(element) {
      document.querySelectorAll('.cause-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      const radio = element.querySelector('input[type="radio"]');
      radio.checked = true;
    }

    // Botones de monto rápido
    function setAmount(value) {
      document.getElementById('monto').value = value;
    }

    // Procesamiento del Formulario
    document.getElementById('donationForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value;
      const email = document.getElementById('email').value;
      const monto = parseInt(document.getElementById('monto').value).toLocaleString('es-CO');
      const metodo = document.getElementById('metodoPago').value;
      
      const causaSeleccionada = document.querySelector('input[name="causa"]:checked');
      const orgNombre = causaSeleccionada.getAttribute('data-org');
      const orgUrl = causaSeleccionada.getAttribute('data-url');

      // Confirmación
      const mensaje = `¡Gracias ${nombre}!\n\nSerás redirigido para completar tu donación de $${monto} COP a través de ${metodo} directamente hacia "${orgNombre}".`;
      
      alert(mensaje);

      // Redirección directa a la organización seleccionada
      window.location.href = orgUrl;
    });
  </script>
</body>
</html>
